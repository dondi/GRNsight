name: Deploy to gh-pages

on:
    push:
        branches:
            - main
            - beta

jobs:
    build-and-deploy:
        concurrency: gh-pages-deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5

            - name: Install Dependencies
              working-directory: ./web-client
              run: npm ci

            - name: Build Web Client
              working-directory: ./web-client
              run: npm run build --if-present

            - name: Configure Git
              run: |
                  git config --global user.email "github-actions@github.com"
                  git config --global user.name "GitHub Actions"

            - name: Sync gh-pages Branch
              run: |
                  git fetch origin gh-pages

                  git checkout gh-pages || git checkout -b gh-pages origin/gh-pages
                  git pull --ff-only origin gh-pages

                  git checkout -B gh-pages-react

            - name: Prepare Deployment Folder
              run: |
                  mkdir -p react-thesis-4081
                  rsync -a --delete web-client/dist/ react-thesis-4081/

            - name: Commit and Push
              id: deployment
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git add -A react-thesis-4081/
                  if ! git diff --cached --quiet; then
                    git commit -m "Deploy React app from ${{ github.sha }}"
                    git push origin gh-pages-react:gh-pages
                    echo "status=deployed" >> $GITHUB_OUTPUT
                  else
                    echo "status=no-changes" >> $GITHUB_OUTPUT
                  fi
